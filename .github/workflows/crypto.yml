name: Crypto Scanner

on:
  schedule:
    # start ~5 min BEFORE each 4h candle close (UTC): 03:55, 07:55, 11:55, 15:55, 19:55, 23:55
    - cron: '55 3,7,11,15,19,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: crypto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for 4h candle close
        run: |
          now=$(date -u +%s)
          next=$(( (now / 14400 + 1) * 14400 ))
          wait=$(( next - now ))
          echo "Seconds to next 4h close: $wait"
          # only wait if the close is within 10 minutes; otherwise run immediately
          if [ "$wait" -le 600 ]; then
            echo "Sleeping $((wait + 10))s until candle closes (+10s buffer)"
            sleep $((wait + 10))
          fi

      - name: Run scanner
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Keep schedule alive
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "Crypto Scanner" --repo "$GITHUB_REPOSITORY" || true
