name: Crypto Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for 4h candle close
        run: |
          now=$(date -u +%s)
          next=$(( (now / 14400 + 1) * 14400 ))
          wait=$(( next - now ))
          echo "Seconds to next 4h close: $wait"
          if [ "$wait" -le 600 ]; then
            echo "Sleeping $((wait + 10))s until candle closes (+10s buffer)"
            sleep $((wait + 10))
          fi

      - name: Run scanner
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "state.json unchanged"
          fi
